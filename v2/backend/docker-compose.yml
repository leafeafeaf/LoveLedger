version: '3.8'

services:

  gateway-service:
    build:
      context: ./gateway-service
    container_name: gateway-service
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SERVER_PORT=8080
    depends_on:
      - mvc-service
      - webflux-service

  mvc-service:
    build:
      context: ./mvc-service
    container_name: mvc-service
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - SERVER_PORT=8081
      - SERVER_SERVLET_CONTEXT_PATH=/mvc

  webflux-service:
    build:
      context: ./webflux-service
    container_name: webflux-service
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      - SERVER_PORT=8082

networks:
  default:
    name: mynetwork
