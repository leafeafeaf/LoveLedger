spring:
  application:
    name: loveledger
  security:
    oauth2:
      client:
        registration:
          google:
            client-name: google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}  # 여기에 client secret 입력
            redirect-uri: ${GOOGLE_REDIRECT_URI}
            authorization-grant-type: authorization_code
            scope:
              - profile
              - email
  jwt:
    secret: ${SECRET_JWT}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DATABASE_URL}
    username: ${DATABASE_NAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      connection-init-sql: "SET SESSION sql_mode=(SELECT REPLACE(@@SESSION.sql_mode, 'ONLY_FULL_GROUP_BY', ''))"

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    database-platform: org.hibernate.dialect.MariaDBDialect

  open-ai:
    key: ${OPENAI_API_KEY}
  gemini-ai:
    key: ${GEMINI_AI_KEY}
    backend-url: ${GEMINI_BACKEND_URL}

cloud:
  aws:
    credentials:
      accessKey: ${S3_ACCESS_KEY}
      secretKey: ${S3_SECRET_KEY}
    s3:
      bucket: ${UPLOAD_IMAGE_BUCKET}
    region:
      static: ${IMAGE_BUCKET_REGION}
    stack:
      auto: false

ssafy:
  url: ${SSAFY_NETWORK_URL}
  apiKey: ${SSAFY_NETWORK_APIKEY}
  fastapi_url: ${FAST_API_URL}

app:
  base-url: ${BASE_URL}
  deep-link-uri-scheme: ${DEEPLINK_URL}
  invite-expiry-hours: ${INVITE_EXPIRE_HOURS}
  android-package-name: ${ANDROID_PACKAGE_NAME}
